name: Oversight IG Reports

on:
  # Schedule held until Horizons deploys POST /hcgi/api/ingest/spending/ig-reports.
  # Re-enable: schedule: [{ cron: "0 12 * * 1" }]
  workflow_dispatch:
    inputs:
      days_back:
        description: "Incremental window in days"
        required: false
        default: "14"
      agency:
        description: "Optional agency name filter"
        required: false
      max_records:
        description: "Cap for a test run"
        required: false
      dry_run:
        description: "Parse only (true/false)"
        required: false
        default: "true"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Oversight.gov ingest
        env:
          HORIZONS_BASE_URL: ${{ secrets.HORIZONS_BASE_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
        run: |
          DAYS="${{ github.event.inputs.days_back }}"
          DAYS="${DAYS:-14}"
          AGENCY="${{ github.event.inputs.agency }}"
          MAX="${{ github.event.inputs.max_records }}"
          DRY="${{ github.event.inputs.dry_run }}"
          CMD=(python -m ingest.oversight --days-back "$DAYS")
          if [ -n "$AGENCY" ]; then
            CMD+=(--agency "$AGENCY")
          fi
          if [ -n "$MAX" ]; then
            CMD+=(--max-records "$MAX")
          fi
          if [ "${DRY}" != "false" ]; then
            CMD+=(--dry-run)
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

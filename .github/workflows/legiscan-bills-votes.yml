name: LegiScan Bills and Votes

# Weekly incremental pull for all 50 states. Dispatch stays dry-run
# unless dry_run=false. Schedule POSTs: /votes exists; /bills and
# /state-coverage 404 are fail-soft so votes still land.
on:
  workflow_dispatch:
    inputs:
      state:
        description: "Single USPS code (required unless all_states)"
        required: false
      all_states:
        description: "All 50 states (true/false)"
        required: false
        default: "false"
      session:
        description: "LegiScan session_id (blank = current)"
        required: false
      days_back:
        description: "Incremental window in days"
        required: false
        default: "14"
      dry_run:
        description: "Parse only (true/false). Default true."
        required: false
        default: "true"
      max_records:
        description: "Cap bills after date filter"
        required: false
  schedule:
    - cron: "0 14 * * 1"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run LegiScan bills/votes
        env:
          HORIZONS_BASE_URL: ${{ secrets.HORIZONS_BASE_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          ST="${{ github.event.inputs.state }}"
          ALL="${{ github.event.inputs.all_states }}"
          SID="${{ github.event.inputs.session }}"
          DAYS="${{ github.event.inputs.days_back }}"
          DAYS="${DAYS:-14}"
          MAX="${{ github.event.inputs.max_records }}"
          CMD=(python -m ingest.legiscan_bills --days-back "$DAYS")
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${ALL}" = "true" ]; then
            CMD+=(--all-states)
          elif [ -n "$ST" ]; then
            CMD+=(--state "$ST")
          else
            echo "Provide state=XX or all_states=true"
            exit 1
          fi
          if [ -n "$SID" ]; then
            CMD+=(--session "$SID")
          fi
          if [ -n "$MAX" ]; then
            CMD+=(--max-records "$MAX")
          fi
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${DRY}" != "false" ]; then
            CMD+=(--dry-run)
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

name: USAspending Ingest

on:
  # Schedule held until Horizons deploys POST /hcgi/api/ingest/spending/awards.
  # Re-enable: schedule: [{ cron: "0 9 * * *" }]
  workflow_dispatch:
    inputs:
      fiscal_year:
        description: "Federal fiscal year (blank = current FY)"
        required: false
      agency:
        description: "Optional agency abbreviation (HHS, DOL, SBA, EPA, DOT)"
        required: false
      days_back:
        description: "Incremental window (default 3)"
        required: false
        default: "3"
      max_records:
        description: "Cap for a test run (blank = no cap)"
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run USAspending ingest
        env:
          HORIZONS_BASE_URL: ${{ secrets.HORIZONS_BASE_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
        run: |
          FY="${{ github.event.inputs.fiscal_year }}"
          if [ -z "$FY" ]; then
            FY=$(python -c "from datetime import date; t=date.today(); print(t.year+1 if t.month>=10 else t.year)")
          fi
          DAYS="${{ github.event.inputs.days_back }}"
          DAYS="${DAYS:-3}"
          AGENCY="${{ github.event.inputs.agency }}"
          MAX="${{ github.event.inputs.max_records }}"
          CMD=(python -m ingest.usaspending --fiscal-year "$FY" --days-back "$DAYS")
          if [ -n "$AGENCY" ]; then
            CMD+=(--agency "$AGENCY")
          fi
          if [ -n "$MAX" ]; then
            CMD+=(--max-records "$MAX")
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

name: Elections state races

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Parse only, do not POST (true/false). Default true."
        required: false
        default: "true"
      cycle:
        description: "Even-year cycle"
        required: false
        default: "2026"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run state legislative race ingest
        env:
          HORIZONS_BASE_URL: ${{ secrets.HORIZONS_BASE_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          CYCLE="${{ github.event.inputs.cycle }}"
          CYCLE="${CYCLE:-2026}"
          CMD=(python -m ingest.elections_state_races --cycle "$CYCLE")
          if [ "${DRY}" != "false" ]; then
            CMD+=(--dry-run)
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

name: LegiScan Legislators

# Monthly roster refresh for all 50 states. Dispatch stays dry-run
# unless dry_run=false. Schedule POSTs to /ingest/members (route exists).
on:
  workflow_dispatch:
    inputs:
      state:
        description: "Single USPS code (blank = all 50 if all_states=true)"
        required: false
      all_states:
        description: "Pull all 50 states (true/false)"
        required: false
        default: "false"
      dry_run:
        description: "Parse only, do not POST (true/false). Default true on dispatch."
        required: false
        default: "true"
  schedule:
    # 1st of month 12:00 UTC — live write
    - cron: "0 12 1 * *"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run LegiScan legislator ingest
        env:
          HORIZONS_BASE_URL: ${{ secrets.HORIZONS_BASE_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          ST="${{ github.event.inputs.state }}"
          ALL="${{ github.event.inputs.all_states }}"
          CMD=(python -m ingest.legiscan)
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${ALL}" = "true" ]; then
            CMD+=(--all-states)
          elif [ -n "$ST" ]; then
            CMD+=(--state "$ST")
          else
            echo "Provide state=XX or all_states=true"
            exit 1
          fi
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${DRY}" != "false" ]; then
            CMD+=(--dry-run)
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

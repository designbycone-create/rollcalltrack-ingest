name: GAO Improper Payments

# Primary path is workflow_dispatch. Annual cron is a backup after
# GAO's typical April Payment Integrity release. Horizons route is not
# deployed yet — dry-run locally before a live dispatch.
on:
  workflow_dispatch:
    inputs:
      fiscal_year:
        description: "Federal FY (must exist in ingest/gao_reports.json)"
        required: true
        default: "2025"
      dry_run:
        description: "Parse only, do not POST"
        required: false
        default: "true"
      max_records:
        description: "Cap program pages (blank = all)"
        required: false
  schedule:
    # May 15 12:00 UTC — backup only
    - cron: "0 12 15 5 *"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run GAO improper-payment ingest
        env:
          HORIZONS_BASE_URL: ${{ secrets.HORIZONS_BASE_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
        run: |
          FY="${{ github.event.inputs.fiscal_year }}"
          FY="${FY:-2025}"
          DRY="${{ github.event.inputs.dry_run }}"
          MAX="${{ github.event.inputs.max_records }}"
          CMD=(python -m ingest.gao --fiscal-year "$FY")
          if [ "${DRY}" != "false" ]; then
            CMD+=(--dry-run)
          fi
          if [ -n "$MAX" ]; then
            CMD+=(--max-records "$MAX")
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

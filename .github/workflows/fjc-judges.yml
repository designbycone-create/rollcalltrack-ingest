name: FJC Judges

# Primary path is workflow_dispatch. Quarterly cron is a backup.
# Horizons route is not deployed yet — scheduled runs stay dry-run
# (empty dispatch inputs != "false").
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Parse only, do not POST (true/false). Default true."
        required: false
        default: "true"
      max_records:
        description: "Cap rows (blank = full directory)"
        required: false
      full_refresh:
        description: "Full directory refresh (this job has no incremental mode)"
        required: false
        default: "true"
  schedule:
    # Jan / Apr / Jul / Oct 15 at 12:00 UTC — backup only
    - cron: "0 12 15 1,4,7,10 *"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run FJC judges ingest
        env:
          HORIZONS_BASE_URL: ${{ secrets.HORIZONS_BASE_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MAX="${{ github.event.inputs.max_records }}"
          CMD=(python -m ingest.fjc --full-refresh)
          if [ "${DRY}" != "false" ]; then
            CMD+=(--dry-run)
          fi
          if [ -n "$MAX" ]; then
            CMD+=(--max-records "$MAX")
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

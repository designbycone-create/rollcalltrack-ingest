name: PRAC Fraud Cases

on:
  # Schedule held until Horizons deploys POST /hcgi/api/ingest/spending/fraud-cases
  # and dry-runs look clean. Re-enable: schedule: [{ cron: "0 12 * * 1" }]
  workflow_dispatch:
    inputs:
      days_back:
        description: "Incremental window in days"
        required: false
        default: "14"
      max_records:
        description: "Cap for a test run"
        required: false
      dry_run:
        description: "Parse only (true/false). Default true."
        required: false
        default: "true"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run PRAC fraud ingest
        env:
          HORIZONS_BASE_URL: ${{ secrets.HORIZONS_BASE_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
        run: |
          DAYS="${{ github.event.inputs.days_back }}"
          DAYS="${DAYS:-14}"
          MAX="${{ github.event.inputs.max_records }}"
          DRY="${{ github.event.inputs.dry_run }}"
          CMD=(python -m ingest.prac --days-back "$DAYS")
          if [ -n "$MAX" ]; then
            CMD+=(--max-records "$MAX")
          fi
          if [ "${DRY}" = "false" ]; then
            CMD+=(--post)
          else
            CMD+=(--dry-run)
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

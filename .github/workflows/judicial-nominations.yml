name: Judicial Nominations

# Own weekly job. Not folded into the House/Senate disclosure workflow —
# that job does not touch Congress.gov nominations. Dispatch is primary.
on:
  workflow_dispatch:
    inputs:
      congress:
        description: "Congress number (blank = current)"
        required: false
      days_back:
        description: "Incremental window in days"
        required: false
        default: "14"
      dry_run:
        description: "Parse only, do not POST (true/false). Default true."
        required: false
        default: "true"
      max_records:
        description: "Cap nominations (blank = window)"
        required: false
  schedule:
    # Monday 13:00 UTC — after the JEFS weekly slot
    - cron: "0 13 * * 1"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run judicial nomination linker
        env:
          HORIZONS_BASE_URL: ${{ secrets.HORIZONS_BASE_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          DAYS="${{ github.event.inputs.days_back }}"
          DAYS="${DAYS:-14}"
          CG="${{ github.event.inputs.congress }}"
          MAX="${{ github.event.inputs.max_records }}"
          CMD=(python -m ingest.nominations --days-back "$DAYS")
          if [ -n "$CG" ]; then
            CMD+=(--congress "$CG")
          fi
          if [ "${DRY}" != "false" ]; then
            CMD+=(--dry-run)
          fi
          if [ -n "$MAX" ]; then
            CMD+=(--max-records "$MAX")
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

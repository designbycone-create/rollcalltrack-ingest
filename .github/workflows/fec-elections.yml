name: FEC Elections

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Parse only, do not POST (true/false). Default true."
        required: false
        default: "true"
      cycle:
        description: "Even-year cycle"
        required: false
        default: "2026"
      max_records:
        description: "Cap OpenFEC totals rows (blank = all)"
        required: false
  schedule:
    - cron: "0 14 1 * *"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run OpenFEC candidate ingest
        env:
          HORIZONS_BASE_URL: ${{ secrets.HORIZONS_BASE_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          FEC_API_KEY: ${{ secrets.FOIA_GOV_API_KEY }}
          FOIA_GOV_API_KEY: ${{ secrets.FOIA_GOV_API_KEY }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          CYCLE="${{ github.event.inputs.cycle }}"
          CYCLE="${CYCLE:-2026}"
          MAX="${{ github.event.inputs.max_records }}"
          CMD=(python -m ingest.fec_elections --cycle "$CYCLE")
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${DRY}" != "false" ]; then
            CMD+=(--dry-run)
          fi
          if [ -n "$MAX" ]; then
            CMD+=(--max-records "$MAX")
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

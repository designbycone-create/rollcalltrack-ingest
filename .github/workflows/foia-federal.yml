name: FOIA.gov Federal Offices

# Monthly roster of federal FOIA components. Dispatch stays dry-run
# unless dry_run=false.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Parse only, do not POST (true/false). Default true."
        required: false
        default: "true"
      max_records:
        description: "Cap offices (blank = all active components)"
        required: false
  schedule:
    - cron: "0 11 1 * *"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run FOIA.gov component ingest
        env:
          HORIZONS_BASE_URL: ${{ secrets.HORIZONS_BASE_URL }}
          INGEST_LIVE: "1"
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          FOIA_GOV_API_KEY: ${{ secrets.FOIA_GOV_API_KEY }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          MAX="${{ github.event.inputs.max_records }}"
          CMD=(python -m ingest.foia_federal)
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${DRY}" != "false" ]; then
            CMD+=(--dry-run)
          fi
          if [ -n "$MAX" ]; then
            CMD+=(--max-records "$MAX")
          fi
          echo "Running: ${CMD[*]}"
          "${CMD[@]}"

name: Disclosure Ingest

on:
  schedule:
    # Runs daily at 09:00 UTC. Adjust as needed — twice-daily is easy to
    # add later (just add a second cron line) if daily proves too slow
    # once the site has traffic depending on freshness.
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # allows manual "Run workflow" trigger from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install tesseract (OCR fallback)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Run ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
        run: python -m ingest.main --source all

name: Disclosure Ingest

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install tesseract (OCR fallback)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Run ingest
        # --source all is House/Senate disclosures plus Senate roll calls.
        # senate.gov blocks the Hostinger IP, so this runner fetches LIS XML.
        env:
          # Horizons HTTP ingest API. Auth is X-Ingest-Key from INGEST_API_KEY.
          HORIZONS_BASE_URL: ${{ secrets.HORIZONS_BASE_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
        run: python -m ingest.main --source all

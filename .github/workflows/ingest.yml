name: Disclosure Ingest

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install tesseract (OCR fallback)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Run ingest
        # --source all is House/Senate disclosures plus Senate roll calls.
        # senate.gov blocks the Hostinger IP, so this runner fetches LIS XML.
        env:
          # Horizons HTTP ingest API (X-Ingest-Key). Superuser PB path not required.
          HORIZONS_BASE_URL: ${{ secrets.HORIZONS_BASE_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
        run: python -m ingest.main --source all

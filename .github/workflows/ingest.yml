name: Disclosure Ingest

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install tesseract (OCR fallback)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Run ingest
        env:
          HORIZONS_BASE_URL: ${{ secrets.HORIZONS_BASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          X_INGEST_KEY: ${{ secrets.X_INGEST_KEY }}
          CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
        run: python -m ingest.main --source all

name: Disclosure Ingest

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      senate_session:
        description: "Senate rolls to post. current = today's session only. 1 = session 1 (119th Congress is 2025, ids s-119-2025-N). all = sessions 1 and 2. Scheduled runs ignore this."
        required: false
        type: choice
        default: current
        options:
          - current
          - "1"
          - "2"
          - all
      dry_run:
        # Do not offer true/false. GitHub coerces those choice strings to
        # booleans, the selected true fails to match, and the default false
        # is what the expression inserts (run 39839118977 posted 659 rolls).
        description: "dry-run does not POST. live posts. true, false, empty, or any other value does not POST. Scheduled runs ignore this and post."
        required: false
        type: choice
        default: dry-run
        options:
          - dry-run
          - live

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Session 1 is 650+ detail XML fetches. The daily job is much shorter
    # and still exits when it finishes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install OCR dependencies
        # pytesseract reads the page image. pdf2image needs poppler (pdftoppm).
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Run ingest
        # Scheduled runs are House/Senate disclosures plus the current Senate
        # session only. senate.gov blocks the Hostinger IP, so this runner
        # fetches LIS XML. A dispatch with senate_session=1 or all backfills
        # that session and does not re-run disclosures.
        # INGEST_LIVE is not set here. scripts/dispatch_ingest.sh exports it
        # only for the schedule or an explicit dry_run=live choice.
        env:
          HORIZONS_BASE_URL: ${{ secrets.HORIZONS_BASE_URL }}
          INGEST_API_KEY: ${{ secrets.INGEST_API_KEY }}
          DISPATCH_EVENT: ${{ github.event_name }}
          # github.event.inputs keeps the raw string. The inputs context
          # boolean-coerces the words true and false.
          DISPATCH_SESSION: ${{ github.event.inputs.senate_session }}
          DISPATCH_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: bash scripts/dispatch_ingest.sh
